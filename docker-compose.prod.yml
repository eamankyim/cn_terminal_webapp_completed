services:
  postgres:
    image: postgres:15-alpine
    container_name: cn_terminal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cn_terminal_db
      POSTGRES_USER: cn_terminal_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"  # Using 5434 (5432, 5433 are taken by other services)
    volumes:
      - cn_terminal_postgres_data:/var/lib/postgresql/data
    networks:
      - cn_terminal_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: cn_terminal_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://cn_terminal_user:${DB_PASSWORD}@postgres:5432/cn_terminal_db?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - PORT=5000
      - FRONTEND_URL=${FRONTEND_URL}
      - PRODUCTION_URL=${PRODUCTION_URL}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - APP_BASE_URL=${APP_BASE_URL}
      - REACT_APP_SENDGRID_API_KEY=${REACT_APP_SENDGRID_API_KEY}
      - REACT_APP_FROM_EMAIL=${REACT_APP_FROM_EMAIL}
      - REACT_APP_FROM_NAME=${REACT_APP_FROM_NAME}
      - REACT_APP_EMAIL_DEV_MODE=${REACT_APP_EMAIL_DEV_MODE}
      - MNOTIFY_API_KEY=${MNOTIFY_API_KEY}
      - MNOTIFY_SENDER_ID=${MNOTIFY_SENDER_ID}
      - MNOTIFY_API_URL=${MNOTIFY_API_URL}
      - SMS_DEV_MODE=${SMS_DEV_MODE:-false}
    ports:
      - "5001:5000"
    depends_on:
      - postgres
    networks:
      - cn_terminal_network
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
    container_name: cn_terminal_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    ports:
      - "3004:3000"  # Using 3004 (3000 is taken by another service)
    depends_on:
      - backend
    networks:
      - cn_terminal_network

  # Nginx service for CN Terminal (connects to existing host-network)
  nginx:
    image: nginx:alpine
    container_name: cn_terminal-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - cn_terminal_network
      - host-network  # Connect to existing host-network
    # Note: Do NOT expose ports 80/443 here - host-nginx handles that

volumes:
  cn_terminal_postgres_data:  # Unique volume name to avoid conflicts

networks:
  cn_terminal_network:
    driver: bridge
  host-network:
    external: true  # Use existing host-network

