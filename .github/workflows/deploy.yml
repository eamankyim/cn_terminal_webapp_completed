name: Deploy to Production

on:
  push:
    branches:
      - production
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.PROD_SERVER_IP }}
        username: ${{ secrets.PROD_SERVER_USER }}
        key: ${{ secrets.PROD_SERVER_SSH_KEY }}
        script: |
          cd ~/cn_terminal || mkdir -p ~/cn_terminal && cd ~/cn_terminal
          
          # Pull latest code from production branch
          echo "📥 Pulling latest code..."
          if [ -d .git ]; then
            git fetch origin
            git checkout production || git checkout -b production
            git pull origin production
          else
            echo "📥 Cloning repository..."
            git clone -b production https://github.com/${{ github.repository }}.git .
            git checkout production
          fi
          
          # Create .env.production file from GitHub secrets
          echo "📝 Creating/updating .env.production file from GitHub secrets..."
          
          # Use DATABASE_URL secret if provided, otherwise construct from DB_PASSWORD
          DATABASE_URL_SECRET="${{ secrets.DATABASE_URL }}"
          DB_PASSWORD_SECRET="${{ secrets.DB_PASSWORD }}"
          
          if [ -n "$DATABASE_URL_SECRET" ]; then
            DB_URL="$DATABASE_URL_SECRET"
          else
            # Construct DATABASE_URL from DB_PASSWORD
            DB_URL="postgresql://cn_terminal_user:${DB_PASSWORD_SECRET}@postgres:5432/cn_terminal_db?schema=public"
          fi
          
          # Create .env.production file
          cat > .env.production << 'ENVEOF'
NODE_ENV=production
DATABASE_URL=__DATABASE_URL_PLACEHOLDER__
PORT=5000
JWT_SECRET=__JWT_SECRET_PLACEHOLDER__
FRONTEND_URL=__FRONTEND_URL_PLACEHOLDER__
PRODUCTION_URL=__PRODUCTION_URL_PLACEHOLDER__
APP_BASE_URL=__APP_BASE_URL_PLACEHOLDER__
CORS_ORIGIN=__CORS_ORIGIN_PLACEHOLDER__
REACT_APP_API_URL=__REACT_APP_API_URL_PLACEHOLDER__
REACT_APP_SENDGRID_API_KEY=__REACT_APP_SENDGRID_API_KEY_PLACEHOLDER__
REACT_APP_FROM_EMAIL=__REACT_APP_FROM_EMAIL_PLACEHOLDER__
REACT_APP_FROM_NAME=__REACT_APP_FROM_NAME_PLACEHOLDER__
REACT_APP_EMAIL_DEV_MODE=false
DB_PASSWORD=__DB_PASSWORD_PLACEHOLDER__
ENVEOF
          
          # Replace placeholders with actual values (using | as delimiter to avoid issues with special chars)
          sed -i "s|__DATABASE_URL_PLACEHOLDER__|${DB_URL}|g" .env.production
          sed -i "s|__JWT_SECRET_PLACEHOLDER__|${{ secrets.JWT_SECRET }}|g" .env.production
          sed -i "s|__FRONTEND_URL_PLACEHOLDER__|${{ secrets.FRONTEND_URL }}|g" .env.production
          sed -i "s|__PRODUCTION_URL_PLACEHOLDER__|${{ secrets.PRODUCTION_URL }}|g" .env.production
          sed -i "s|__APP_BASE_URL_PLACEHOLDER__|${{ secrets.APP_BASE_URL }}|g" .env.production
          sed -i "s|__CORS_ORIGIN_PLACEHOLDER__|${{ secrets.CORS_ORIGIN }}|g" .env.production
          sed -i "s|__REACT_APP_API_URL_PLACEHOLDER__|${{ secrets.REACT_APP_API_URL }}|g" .env.production
          sed -i "s|__REACT_APP_SENDGRID_API_KEY_PLACEHOLDER__|${{ secrets.REACT_APP_SENDGRID_API_KEY }}|g" .env.production
          sed -i "s|__REACT_APP_FROM_EMAIL_PLACEHOLDER__|${{ secrets.REACT_APP_FROM_EMAIL }}|g" .env.production
          sed -i "s|__REACT_APP_FROM_NAME_PLACEHOLDER__|${{ secrets.REACT_APP_FROM_NAME }}|g" .env.production
          sed -i "s|__DB_PASSWORD_PLACEHOLDER__|${DB_PASSWORD_SECRET}|g" .env.production
          
          echo "✅ .env.production file created from GitHub secrets"
          
          # Make scripts executable
          chmod +x deploy.sh auto-deploy.sh deploy-production.sh 2>/dev/null || true
          
          # Load environment variables
          source .env.production
          
          # Build and start containers
          echo "🚀 Building and starting containers..."
          docker-compose -f docker-compose.prod.yml down || true
          docker-compose -f docker-compose.prod.yml build --no-cache
          docker-compose -f docker-compose.prod.yml up -d
          
          # Wait for containers to be fully up
          echo "⏳ Waiting for containers to be ready..."
          sleep 20
          
          # Connect nginx to host-network (if not already connected)
          echo "🔗 Connecting nginx to host-network..."
          docker network connect host-network cn_terminal-nginx 2>/dev/null || echo "Already connected or network doesn't exist"
          
          # Setup database (only for first deployment or schema changes)
          echo "🗄️ Setting up database..."
          docker exec cn_terminal_backend npx prisma generate || true
          docker exec cn_terminal_backend npx prisma db push || true
          
          echo "✅ Deployment complete!"
          echo ""
          echo "📊 Container Status:"
          docker-compose -f docker-compose.prod.yml ps
          echo ""
          echo "📋 Next steps:"
          echo "  - Create admin user: docker exec -it cn_terminal_backend node scripts/create-admin.js"
          echo "  - Check logs: docker-compose -f docker-compose.prod.yml logs -f"
